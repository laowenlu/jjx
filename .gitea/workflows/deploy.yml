name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      SWA_DEPLOYMENT_TOKEN:
        description: 'Static Web Apps deployment token'
        required: true
      VITE_HITHINK_API_KEY:
        description: 'HiThink API key bundled into the frontend'
        required: true

jobs:
  build-and-deploy:
    runs-on: linux_amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Frontend (React/Vite) ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build frontend
        working-directory: react-app
        env:
          VITE_HITHINK_API_KEY: ${{ github.event.inputs.VITE_HITHINK_API_KEY }}
        run: npm run build

      # ---------- Deploy ----------
      - name: Deploy Static Web App
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if npx -y @azure/static-web-apps-cli@2.0.6 deploy \
              --app-location react-app \
              --output-location dist \
              --env Production \
              --deployment-token "${{ github.event.inputs.SWA_DEPLOYMENT_TOKEN }}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Static Web App deployment failed after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Static Web App deployment attempt ${attempt} failed; retrying in ${delay}s..."
            sleep "$delay"
          done
